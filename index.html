<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Monaco</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }

      .editor-container {
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          background-color: #1a1b26;
      }
      .tabs-container {
          background-color: #16161e;
          display: flex;
          height: 40px;
          overflow-x: auto;
          border-bottom: 1px solid #1a1b26;
          padding: 6px 8px 0 8px;
          gap: 6px;
      }
      .tabs-container::-webkit-scrollbar {
          height: 4px;
      }
      .tabs-container::-webkit-scrollbar-thumb {
          background-color: #3b4261;
          border-radius: 4px;
      }
      .tab {
          display: flex;
          align-items: center;
          padding: 0 16px;
          background-color: #1f2335;
          color: #565f89;
          border-radius: 6px 6px 0 0;
          min-width: 120px;
          max-width: 200px;
          position: relative;
          cursor: pointer;
          transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
          user-select: none;
          box-shadow: inset 0 -2px 0 transparent;
      }
      .tab:hover {
          background-color: #24283b;
          color: #a9b1d6;
      }
      .tab.active {
          background-color: #1a1b26;
          color: #7aa2f7;
          box-shadow: inset 0 2px 0 #7aa2f7;
      }
      .tab-icon {
          width: 20px;
          height: 20px;
          margin-right: 8px;
          display: flex;
          align-items: center;
          justify-content: center; 
          position: relative; 
          top: 1px;
      }
      .tab-icon svg {
          width: 16px;
          height: 16px;
          fill: currentColor;
      }
      .tab-title {
          flex-grow: 1;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          font-size: 13px;
          font-weight: 500;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .tab-title.editing {
          background: #1a1b26;
          border: 1px solid #3b4261;
          color: #c0caf5;
          padding: 2px 6px;
          border-radius: 4px;
          outline: none;
      }
      .tab-close {
          margin-left: 8px;
          opacity: 0;
          transition: all 0.2s;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 20px;
          height: 20px;
          border-radius: 4px;
      }
      .tab:hover .tab-close, .tab.active .tab-close {
          opacity: 0.7;
      }
      .tab-close:hover {
          opacity: 1 !important;
          background-color: #f7768e33;
          color: #f7768e;
      }
      .tab.new-tab {
          min-width: 28px;
          max-width: 28px;
          height: 28px;
          margin-top: 3px;
          padding: 0;
          border-radius: 6px;
          justify-content: center;
          background-color: transparent;
          color: #565f89;
          font-size: 16px;
          font-weight: bold;
          box-shadow: none;
      }
      .tab.new-tab:hover {
          background-color: #1f2335;
          color: #7aa2f7;
      }
      @keyframes tabAppear {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
      }
      @keyframes tabRemove {
          to { opacity: 0; transform: scale(0.9); }
      }
      .tab.new {
          animation: tabAppear 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .tab.removing {
          animation: tabRemove 0.2s ease-out forwards;
      }
  
    </style>

class Tab {
    constructor(title, content = '') {
        this.id = 'tab-' + Math.random().toString(36).substr(2, 9);
        this.title = title;
        this.content = content;
        this.element = null;
    }
}

function saveTabs() {
    const tabsData = tabs.map(tab => ({
        id: tab.id,
        title: tab.title,
        content: tab.content
    }));
    localStorage.setItem('editorTabs', JSON.stringify(tabsData));
}
function loadTabs() {
    const savedTabs = localStorage.getItem('editorTabs');
    if (savedTabs) {
        const tabsData = JSON.parse(savedTabs);
        tabsData.forEach(tabData => {
            addTab(tabData.title, tabData.content, tabData.id);
        });
    } else {
        addTab('New Tab 1'); 
    }
}

function makeEditable(titleElement, tab) {
    titleElement.contentEditable = true;
    titleElement.classList.add('editing');
    titleElement.focus();
    
    const range = document.createRange();
    range.selectNodeContents(titleElement);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    function finishEditing() {
        titleElement.contentEditable = false;
        titleElement.classList.remove('editing');
        const newTitle = titleElement.textContent.trim();
        if (newTitle) {
            tab.title = newTitle;
        } else {
            titleElement.textContent = tab.title;
        }
    }

    titleElement.onblur = finishEditing;
    titleElement.onkeydown = (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            finishEditing();
        }
        if (e.key === 'Escape') {
            titleElement.textContent = tab.title;
            finishEditing();
        }
    };
}

function createTabElement(tab) {
    const tabElement = document.createElement('div');
    tabElement.className = 'tab new';
    tabElement.setAttribute('data-tab-id', tab.id);
    
    const iconElement = document.createElement('div');
    iconElement.className = 'tab-icon';
    iconElement.innerHTML = luaIcon;
    
    const titleElement = document.createElement('div');
    titleElement.className = 'tab-title';
    titleElement.textContent = tab.title;
    
    titleElement.ondblclick = (e) => {
        e.stopPropagation();
        makeEditable(titleElement, tab);
    };
    
    const closeButton = document.createElement('div');
    closeButton.className = 'tab-close';
    closeButton.innerHTML = '✕';
    closeButton.onclick = (e) => {
        e.stopPropagation();
        if (tabs.length > 1) {
            removeTab(tab.id);
        }
    };
    
    tabElement.appendChild(iconElement);
    tabElement.appendChild(titleElement);
    tabElement.appendChild(closeButton);
    
    tabElement.onclick = () => switchTab(tab.id);
    
    return tabElement;
}

function createNewTabButton() {
    const newTabButton = document.createElement('div');
    newTabButton.className = 'tab new-tab';
    newTabButton.innerHTML = '+';
    newTabButton.onclick = () => {
        const newTab = addTab('New Tab ' + (tabs.length + 1));
    };
    return newTabButton;
}

function addTab(title, content = '', id = null) {
    const defaultText = "print('Vyrix.win')";    
    if (!content) {
        content = defaultText;
    }
    
    const tab = new Tab(title, content);
    if (id) tab.id = id;
    tabs.push(tab);
    
    const tabsContainer = document.getElementById('tabs-container');
    const newTabButton = tabsContainer.querySelector('.new-tab');
    
    tab.element = createTabElement(tab);
    if (newTabButton) {
        tabsContainer.insertBefore(tab.element, newTabButton);
    } else {
        tabsContainer.appendChild(tab.element);
        tabsContainer.appendChild(createNewTabButton());
    }
    
    switchTab(tab.id);
    saveTabs();
    return tab;
}

function removeTab(tabId) {
    const tabIndex = tabs.findIndex(t => t.id === tabId);
    if (tabIndex === -1) return;
    
    if (tabs.length <= 1) return;
    
    const tab = tabs[tabIndex];
    tab.element.classList.add('removing');
    
    setTimeout(() => {
        tabs.splice(tabIndex, 1);
        tab.element.remove();
        
        if (currentTab === tabId) {
            switchTab(tabs[Math.min(tabIndex, tabs.length - 1)].id);
        }
        saveTabs();
    }, 200);
}

function switchTab(tabId) {
    const tab = tabs.find(t => t.id === tabId);
    if (!tab) return;
    
    tabs.forEach(t => {
        if (t.element) {
            t.element.classList.remove('active');
        }
    });
    
    if (currentTab !== tabId) {
        if (currentTab) {
            const oldTab = tabs.find(t => t.id === currentTab);
            if (oldTab) {
                oldTab.content = editor.getValue();
                saveTabs();
            }
        }
        
        const contentToSet = tab.content.trim() === '' ? "print('Vyrix.win')" : tab.content;        
        editor.setValue(contentToSet);
        tab.element.classList.add('active');
        currentTab = tabId;
    }
}

function setupAutosave() {
    let saveTimeout;
    editor.onDidChangeModelContent(() => {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            if (currentTab) {
                const tab = tabs.find(t => t.id === currentTab);
                if (tab) {
                    tab.content = editor.getValue();
                    saveTabs();
                }
            }
        }, 1); 
    });
}

window.enableAntiSkid = function() {
    document.body.style.filter = "blur(5px)";
    document.body.addEventListener("mouseover", handleover);
    document.body.addEventListener("mouseleave", handleleave);
};
window.disableAntiSkid = function() {
    document.body.style.filter = "blur(0px)";
    document.body.removeEventListener("mouseover", handleover, false);
    document.body.removeEventListener("mouseleave", handleleave, false);
};
function handleover() { document.body.style.filter = "blur(0px)" }
function handleleave() { document.body.style.filter = "blur(5px)" }

window.SetText = function (x) { editor.setValue(x); };
window.ShowMinimap = function () { editor.updateOptions({ minimap: { enabled: true } }); };
window.HideMinimap = function () { editor.updateOptions({ minimap: { enabled: false } }); };
window.EnableAutoComplete = function(){
    editor.updateOptions({ suggestOnTriggerCharacters: true, acceptSuggestionOnEnter : "smart", wordBasedSuggestions : true });
};
window.DisableAutoComplete = function(){
    editor.updateOptions({ suggestOnTriggerCharacters: false, acceptSuggestionOnEnter : "off", wordBasedSuggestions : false });
};
window.GetText = function () { return editor.getValue(); };
window.Refresh = function () {
    var text = window.GetText();
    window.SetText("");
    editor.trigger('keyboard', 'type', { text: text });
};
